[project]
name = "fsm-assistant"
version = "0.1.0"
description = "FSM assistant challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
fsm-assistant = "fsm_assistant.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Tests are checked against the package's types, but need no annotations of
# their own, and may assert on an optional value without narrowing it first
# (a None there fails the test when it runs). A test module not listed here
# is checked as strictly as the package.
[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_backtest",
    "test_config",
    "test_db",
    "test_real_db",
    "test_schema_context",
    "test_smoke",
    "test_sql_guard",
    "test_sql_scan",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
strict_optional = false
warn_return_any = false
