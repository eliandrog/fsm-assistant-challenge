[project]
name = "fsm-assistant"
version = "0.1.0"
description = "FSM assistant challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fsm-assistant = "fsm_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
