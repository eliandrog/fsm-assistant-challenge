[project]
name = "fsm-assistant"
version = "0.1.0"
description = "FSM assistant challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165,<0.166",
    "langchain-anthropic>=1.7,<2",
    "langgraph>=1.2,<1.3",
    "langsmith>=0.16,<0.17",
    "pydantic>=2,<3",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
fsm-assistant = "fsm_assistant.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
