[[case]]
id = "rule-combined"
tests = "A combined rule: two transaction columns and a subquery that itself joins cards to users"
tags = ["rule", "cards", "users", "subquery", "cents", "multi-table"]
tuned = false
[[case.turn]]
question = "Propose a rule: online transactions over $200 made with credit cards whose owner has a credit score below 650."
outcome = "rule_proposed"
clause = """
transaction_type = 'Online Transaction'
AND amount_usd_cents > 20000
AND card_id IN (
  SELECT c.id FROM cards c JOIN users u ON u.id = c.user_id
  WHERE c.card_type = 'Credit' AND u.credit_score < 650
)
"""
flagged = 349
flagged_labelled = 237
true_positives = 0
false_positives = 237

[[case]]
