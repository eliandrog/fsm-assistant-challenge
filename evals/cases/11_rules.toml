true_positives = 0
false_positives = 744

[[case]]
id = "rule-location"
tests = "The known-good rule: city with state, through the location key; it catches all labelled fraud"
tags = ["rule", "location", "subquery", "trap:city-state"]
tuned = false
[[case.turn]]
question = "Propose a rule that flags transactions at merchant locations in Rome, Italy."
outcome = "rule_proposed"
clause = "merchant_location_id IN (SELECT id FROM merchant_locations WHERE city = 'Rome' AND state = 'Italy')"
flagged = 2431
flagged_labelled = 1598
true_positives = 1360
false_positives = 238

[[case]]
id = "rule-time-of-day"
tests = "A rule on the hour taken from the timestamp, both ends included"
tags = ["rule", "date", "hour"]
tuned = false
[[case.turn]]
question = "Create a rule for transactions made at night, from 01:00 up to and including 04:59."
outcome = "rule_proposed"
clause = "CAST(strftime('%H', date) AS INTEGER) BETWEEN 1 AND 4"
flagged = 39019
flagged_labelled = 26280
true_positives = 2
false_positives = 26278

[[case]]
id = "rule-combined"
tests = "A combined rule: two transaction columns and a subquery that itself joins cards to users"
tags = ["rule", "cards", "users", "subquery", "cents", "multi-table"]
tuned = false
[[case.turn]]
question = "Propose a rule: online transactions over $200 made with credit cards whose owner has a credit score below 650."
outcome = "rule_proposed"
clause = """
transaction_type = 'Online Transaction'
AND amount_usd_cents > 20000
AND card_id IN (
  SELECT c.id FROM cards c JOIN users u ON u.id = c.user_id
  WHERE c.card_type = 'Credit' AND u.credit_score < 650
)
"""
flagged = 349
flagged_labelled = 237
true_positives = 0
false_positives = 237

[[case]]
id = "rule-negative-amounts"
tests = "A rule on negative amounts, where 'more than $300' means below -30000 cents"
tags = ["rule", "cents", "negative-amounts"]
tuned = false
[[case.turn]]
question = "Flag refunds of more than $300, that is, transactions with a negative amount below -$300."
outcome = "rule_proposed"
clause = "amount_usd_cents < -30000"
flagged = 3514
flagged_labelled = 2321
true_positives = 6
false_positives = 2315
